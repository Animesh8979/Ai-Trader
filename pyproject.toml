[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godmode-trader"
version = "4.0.0"
description = "Godmode Trading Agent — a precise, automated, reliable multi-agent autonomous trading system (paper-first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Godmode Trader" }]
keywords = ["trading", "ai-agents", "llm", "crypto", "backtesting", "risk-management"]

dependencies = [
  "litellm>=1.40",
  "ccxt>=4.2",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "rich>=13.5",
  "httpx>=0.27",
  "tenacity>=8.2",
  "polars>=0.20",
  "numpy>=1.26",
  "duckdb>=0.10",
  "mplfinance>=0.12",
  "networkx>=3.2",
]

[project.optional-dependencies]
execution = ["nautilus_trader>=1.190"]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "websockets>=12"]
vision = ["pillow>=10.0"]
alerts = ["python-telegram-bot>=21"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
godmode = "godmode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"