[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godmode-trader"
version = "0.1.0"
description = "Godmode Trading Agent — a precise, automated, reliable multi-agent autonomous trading system (paper-first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Godmode Trader" }]
keywords = ["trading", "ai-agents", "llm", "crypto", "backtesting", "nautilustrader", "risk-management"]

# Phase 0 dependencies are intentionally LIGHT and Windows-friendly (all pure-python or easy wheels).
# Heavy / phase-specific deps live in optional-dependencies below so the first install "just works".
dependencies = [
  "litellm>=1.40",          # model-agnostic LLM layer (Claude / Gemini / OpenAI / Ollama)
  "ccxt>=4.2",              # crypto exchange connectivity for the Phase 0 smoke test
  "pydantic>=2.5",          # typed config models
  "pydantic-settings>=2.1", # .env + settings loading
  "PyYAML>=6.0",            # yaml config files
  "python-dotenv>=1.0",     # .env loading
  "loguru>=0.7",            # structured logging
  "rich>=13.5",             # pretty CLI / setup wizard (good for non-technical users)
  "httpx>=0.27",            # http client
  "tenacity>=8.2",          # retries with backoff
]

[project.optional-dependencies]
# Phase 1: the NautilusTrader execution + backtest core (heavier install; added when we reach Phase 1).
execution = ["nautilus_trader>=1.190"]
# Phase 3: the local web dashboard (live PnL, positions, agent reasoning, STOP button).
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "websockets>=12"]
# Phase 3: optional phone/email alerts.
alerts = ["python-telegram-bot>=21"]
# Development / testing.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
godmode = "godmode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
